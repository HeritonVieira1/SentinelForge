name: Container security

# Constrói a imagem, analisa com Trivy (Dockerfile, dependências, imagem), gera SBOM, aplica o Security Gate
# (security/security-policy.json) e só então publica no GitHub Container Registry.
#
# Publicação real: SOMENTE em push/dispatch na branch main ou em tag v*.*.*. Em qualquer outra ref o job de
# publicação roda em DRY-RUN (não faz login, push, assinatura nem atestado). Se o gate reprovar, a publicação
# nem inicia (needs). A imagem publicada é exatamente a que foi escaneada (mesmo tar + conferência do image ID).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      runtime_image_override:
        description: "SOMENTE para validar o gate: substitui a imagem de runtime (por exemplo, uma imagem antiga). Nunca publica."
        required: false
        default: ""
  workflow_call:

permissions: {}

concurrency:
  group: container-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Ferramentas fixadas por versão + digest (revisar no Dependabot/PR ao atualizar).
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c # 0.76.1
  PYTHON_IMAGE: python@sha256:ae14d4ce8771606477a81446e7ef429edd6762305fc50c84507c1041fa8285d1 # 3.13-slim
  # Mirror como alternativa caso o GHCR limite o download da base de vulnerabilidades.
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2

jobs:
  build-scan:
    name: Build, scan and gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # enviar SARIF ao Code Scanning
    outputs:
      image-id: ${{ steps.build.outputs.image-id }}
      version: ${{ steps.meta.outputs.version }}
      override-used: ${{ steps.meta.outputs.override-used }}
    env:
      RUNTIME_IMAGE_OVERRIDE: ${{ github.event.inputs.runtime_image_override }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute metadata
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::12}"
          if [ "${REF_TYPE}" = "tag" ] && [[ "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            version="${REF_NAME#v}"
          else
            version="0.0.0-${short}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "short=${short}" >> "${GITHUB_OUTPUT}"
          if [ -n "${RUNTIME_IMAGE_OVERRIDE}" ]; then
            echo "override-used=true" >> "${GITHUB_OUTPUT}"
            echo "::warning title=Gate validation mode::runtime image override in use; this run can never publish."
          else
            echo "override-used=false" >> "${GITHUB_OUTPUT}"
          fi
          mkdir -p "${RUNNER_TEMP}/reports" "${RUNNER_TEMP}/trivy-cache"
          chmod 777 "${RUNNER_TEMP}/reports" "${RUNNER_TEMP}/trivy-cache"

      - name: Build image
        id: build
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          args=(--build-arg "VERSION=${VERSION}" --build-arg "REVISION=${GITHUB_SHA}")
          if [ -n "${RUNTIME_IMAGE_OVERRIDE}" ]; then
            args+=(--build-arg "RUNTIME_IMAGE=${RUNTIME_IMAGE_OVERRIDE}")
          fi
          # Atestados são anexados depois, de forma verificável (GitHub attestations); aqui o build é determinístico.
          docker build --provenance=false --sbom=false "${args[@]}" -t sentinelforge:scan .
          echo "image-id=$(docker inspect --format '{{.Id}}' sentinelforge:scan)" >> "${GITHUB_OUTPUT}"
          docker save sentinelforge:scan -o "${RUNNER_TEMP}/reports/image.tar"

      # Cada scan grava JSON (fonte de verdade do gate). SARIF, tabela e SBOM são derivados.
      - name: Trivy - Dockerfile and IaC misconfiguration
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e TRIVY_CACHE_DIR=/cache -e TRIVY_DB_REPOSITORY \
            -v "${RUNNER_TEMP}/trivy-cache:/cache" -v "${RUNNER_TEMP}/reports:/out" -v "${GITHUB_WORKSPACE}:/src:ro" \
            "${TRIVY_IMAGE}" config /src --format json --output /out/trivy-config.json --quiet

      - name: Trivy - repository dependencies, secrets and misconfiguration
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e TRIVY_CACHE_DIR=/cache -e TRIVY_DB_REPOSITORY \
            -v "${RUNNER_TEMP}/trivy-cache:/cache" -v "${RUNNER_TEMP}/reports:/out" -v "${GITHUB_WORKSPACE}:/src:ro" \
            "${TRIVY_IMAGE}" fs /src --scanners vuln,secret,misconfig --format json --output /out/trivy-fs.json --quiet

      - name: Trivy - image
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e TRIVY_CACHE_DIR=/cache -e TRIVY_DB_REPOSITORY \
            -v "${RUNNER_TEMP}/trivy-cache:/cache" -v "${RUNNER_TEMP}/reports:/out" \
            "${TRIVY_IMAGE}" image --input /out/image.tar --scanners vuln,secret --format json --output /out/trivy-image.json --quiet

      - name: Reports (SARIF, table) and SBOM (CycloneDX)
        run: |
          set -euo pipefail
          trivy() { docker run --rm --user "$(id -u):$(id -g)" -e TRIVY_CACHE_DIR=/cache -e TRIVY_DB_REPOSITORY \
            -v "${RUNNER_TEMP}/trivy-cache:/cache" -v "${RUNNER_TEMP}/reports:/out" "${TRIVY_IMAGE}" "$@"; }
          for name in config fs image; do
            trivy convert --format sarif --output "/out/trivy-${name}.sarif" "/out/trivy-${name}.json"
            trivy convert --format table --output "/out/trivy-${name}.txt" "/out/trivy-${name}.json"
          done
          trivy image --input /out/image.tar --format cyclonedx --output /out/sbom.cdx.json --quiet

      - name: Security gate
        id: gate
        run: |
          set +e
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/repo:ro" -v "${RUNNER_TEMP}/reports:/out" -w /repo \
            "${PYTHON_IMAGE}" python -I security/scripts/evaluate_gate.py \
              --policy security/security-policy.json \
              --label "container image, Dockerfile and dependencies" \
              --trivy /out/trivy-image.json --trivy /out/trivy-config.json --trivy /out/trivy-fs.json \
              --summary /out/gate-summary.md --result /out/gate-result.json
          code=$?
          if [ -f "${RUNNER_TEMP}/reports/gate-summary.md" ]; then cat "${RUNNER_TEMP}/reports/gate-summary.md" >> "${GITHUB_STEP_SUMMARY}"; fi
          echo "exit-code=${code}" >> "${GITHUB_OUTPUT}"
          exit ${code}

      # Roda mesmo se o gate reprovou: o relatório é a evidência da reprovação.
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-security-reports
          path: |
            ${{ runner.temp }}/reports/*.json
            ${{ runner.temp }}/reports/*.sarif
            ${{ runner.temp }}/reports/*.txt
            ${{ runner.temp }}/reports/*.md
          if-no-files-found: warn
          retention-days: 30

      - name: Upload SARIF - image
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/reports/trivy-image.sarif
          category: trivy-image

      - name: Upload SARIF - Dockerfile
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/reports/trivy-config.sarif
          category: trivy-dockerfile

      - name: Upload SARIF - dependencies
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/reports/trivy-fs.sarif
          category: trivy-dependencies

      # Só chega aqui se o gate aprovou (passos anteriores falhos interrompem o job).
      - name: Upload scanned image (for the publish job)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scanned-image
          path: |
            ${{ runner.temp }}/reports/image.tar
            ${{ runner.temp }}/reports/sbom.cdx.json
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish to GHCR
    needs: [build-scan] # gate reprovado => build-scan falha => este job é ignorado
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push no ghcr.io
      id-token: write # assinatura keyless (Sigstore) e atestados
      attestations: write
    env:
      VERSION: ${{ needs.build-scan.outputs.version }}
      EXPECTED_IMAGE_ID: ${{ needs.build-scan.outputs.image-id }}
      OVERRIDE_USED: ${{ needs.build-scan.outputs.override-used }}
      EVENT_NAME: ${{ github.event_name }}
      REF_TYPE: ${{ github.ref_type }}
      REF_NAME: ${{ github.ref_name }}
      GH_REF: ${{ github.ref }}
    steps:
      - name: Decide publication mode
        id: mode
        run: |
          set -euo pipefail
          publish=false
          if [ "${OVERRIDE_USED}" != "true" ]; then
            if [ "${GH_REF}" = "refs/heads/main" ]; then publish=true; fi
            if [ "${REF_TYPE}" = "tag" ] && [[ "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then publish=true; fi
          fi
          echo "publish=${publish}" >> "${GITHUB_OUTPUT}"
          if [ "${publish}" = "true" ]; then
            echo "Mode: PUBLISH (ref ${GH_REF})" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Mode: DRY-RUN (ref ${GH_REF} is not main or a release tag, or gate-validation override in use). Nothing will be pushed." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Download scanned image and SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scanned-image
          path: scanned

      - name: Load image and verify it is the one that was scanned
        run: |
          set -euo pipefail
          docker load -i scanned/image.tar
          actual="$(docker inspect --format '{{.Id}}' sentinelforge:scan)"
          echo "scanned : ${EXPECTED_IMAGE_ID}"
          echo "loaded  : ${actual}"
          test "${actual}" = "${EXPECTED_IMAGE_ID}"

      - name: Compute tags
        id: tags
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          short="${GITHUB_SHA::12}"
          tags=("${repo}:sha-${short}")
          if [ "${REF_TYPE}" = "tag" ]; then
            major_minor="${VERSION%.*}"
            tags+=("${repo}:${VERSION}" "${repo}:${major_minor}")
          else
            tags+=("${repo}:${REF_NAME//\//-}")
          fi
          echo "repo=${repo}" >> "${GITHUB_OUTPUT}"
          printf 'tags=%s\n' "${tags[*]}" >> "${GITHUB_OUTPUT}"
          printf 'Tags: %s\n' "${tags[*]}"

      - name: DRY-RUN - what would be published
        if: steps.mode.outputs.publish != 'true'
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          echo "DRY-RUN: would push -> ${TAGS}"
          echo "DRY-RUN: would sign (Cosign keyless) and attest provenance + SBOM"
          echo "DRY-RUN: would push -> ${TAGS}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Log in to ghcr.io
        if: steps.mode.outputs.publish == 'true'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${REGISTRY_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Push image
        id: push
        if: steps.mode.outputs.publish == 'true'
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          REPO: ${{ steps.tags.outputs.repo }}
        run: |
          set -euo pipefail
          for tag in ${TAGS}; do
            docker tag sentinelforge:scan "${tag}"
            docker push "${tag}"
          done
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${REPO}:sha-${GITHUB_SHA::12}" | cut -d@ -f2)"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Published image"
            echo ""
            echo "- Digest: \`${digest}\`"
            echo "- Pull by digest: \`docker pull ${REPO}@${digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Install Cosign
        if: steps.mode.outputs.publish == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Assinatura keyless: a identidade é o próprio workflow (OIDC do GitHub), sem chave privada para vazar.
      - name: Sign image (Cosign, keyless)
        if: steps.mode.outputs.publish == 'true'
        env:
          REPO: ${{ steps.tags.outputs.repo }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REPO}@${DIGEST}"

      - name: Attest build provenance
        if: steps.mode.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.tags.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM
        if: steps.mode.outputs.publish == 'true'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ steps.tags.outputs.repo }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: scanned/sbom.cdx.json
          push-to-registry: true
