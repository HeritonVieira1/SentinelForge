name: Release

# Liberação de versão por tag semântica (vX.Y.Z). Nada é publicado se qualquer controle obrigatório falhar:
#   1. a tag precisa apontar para um commit que já está na main;
#   2. os checks de segurança desse commit na main (CI, Gitleaks, CodeQL) precisam ter passado;
#   3. o CI completo roda de novo sobre a tag;
#   4. a imagem passa pelo Security Gate (container-security.yml) e só então é publicada no GHCR,
#      assinada (Cosign keyless) e com atestados de proveniência e SBOM;
#   5. o GitHub Release é criado por último, com SBOM, relatórios e checksums anexados.
# Não há deploy em infraestrutura externa nesta fase.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release preconditions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag must point to a commit that is already on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error title=Release blocked::tag ${TAG_NAME} (${GITHUB_SHA}) is not contained in main."
            exit 1
          fi
          echo "OK: ${GITHUB_SHA} is on main"

      - name: Required security checks must have passed on this commit
        run: |
          set -euo pipefail
          required=("CI gate" "Gitleaks" "Analyze (csharp)")
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" --jq '.check_runs')"
          failed=0
          for name in "${required[@]}"; do
            conclusion="$(jq -r --arg n "${name}" '[.[] | select(.name == $n)] | sort_by(.completed_at) | last | .conclusion // "missing"' <<<"${runs}")"
            echo "${name}: ${conclusion}"
            if [ "${conclusion}" != "success" ]; then failed=1; fi
          done
          if [ "${failed}" -ne 0 ]; then
            echo "::error title=Release blocked::a required security check did not succeed on ${GITHUB_SHA}."
            exit 1
          fi

  ci:
    name: CI
    needs: [verify]
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  container:
    name: Container security and publish
    needs: [verify, ci]
    uses: ./.github/workflows/container-security.yml
    permissions:
      contents: read
      security-events: write
      packages: write
      id-token: write
      attestations: write

  github-release:
    name: GitHub Release
    needs: [container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # criar o Release (único job com escrita em contents)
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - name: Download SBOM and security reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-security-reports
          path: assets/container-security-reports

      - name: Prepare assets and checksums
        run: |
          set -euo pipefail
          mkdir release-assets
          cp assets/container-security-reports/sbom.cdx.json release-assets/sentinelforge-sbom.cdx.json
          cp assets/container-security-reports/gate-summary.md release-assets/security-gate-summary.md
          cp assets/container-security-reports/trivy-image.json release-assets/trivy-image-report.json
          (cd release-assets && sha256sum -- * > SHA256SUMS)
          ls -l release-assets

      - name: Create GitHub Release
        run: |
          set -euo pipefail
          gh release create "${TAG_NAME}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG_NAME}" \
            --generate-notes \
            --verify-tag
