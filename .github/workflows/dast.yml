name: DAST

# OWASP ZAP contra a API em ambiente ISOLADO e descartável (Docker Compose com rede interna, sem internet,
# credenciais geradas na hora). Modos:
#   baseline (PRs e pushes na main): análise passiva autenticada a partir do OpenAPI.
#   active   (agenda semanal e execução manual): acrescenta ataques ativos, SOMENTE contra este ambiente.
#
# NUNCA aponte este workflow para sistemas externos ou de produção: o alvo é fixo (http://api:8080 na rede interna do
# Compose) e a ferramenta de varredura não tem rota para a internet. Alertas do ZAP são hipóteses a validar, não
# vulnerabilidades confirmadas: veja security/dast-testing.md.
on:
  pull_request:
    paths:
      - "src/**"
      - "Dockerfile"
      - "global.json"
      - "Directory.Build.props"
      - "security/dast/**"
      - "security/scripts/evaluate_gate.py"
      - "security/security-policy.json"
      - "security/exceptions.json"
      - ".github/workflows/dast.yml"
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * 3" # quartas, 05:23 UTC: varredura ativa completa
  workflow_dispatch:
    inputs:
      mode:
        description: "baseline (passivo) ou active (ataques; apenas no ambiente isolado)"
        type: choice
        options: [baseline, active]
        default: baseline

permissions: {}

concurrency:
  group: dast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zap:
    name: ZAP (isolated environment)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      MODE: ${{ github.event_name == 'schedule' && 'active' || github.event.inputs.mode || 'baseline' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET (EF Core script generation)
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build the API image under test
        run: docker build --provenance=false --sbom=false -t sentinelforge:scan .

      - name: Run ZAP against the isolated environment
        env:
          API_IMAGE: sentinelforge:scan
          REPORT_DIR: ${{ github.workspace }}/dast-reports
          KEEP_LOGS: "true"
        run: bash security/dast/run-dast.sh

      - name: Job summary
        if: always()
        run: |
          {
            echo "## DAST (${MODE})"
            if [ -f dast-reports/gate-summary.md ]; then cat dast-reports/gate-summary.md; else echo "_Gate summary was not produced._"; fi
          } >> "${GITHUB_STEP_SUMMARY}"

      # Os relatórios são evidência mesmo (e principalmente) quando o gate reprova.
      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-reports-${{ env.MODE }}
          path: |
            dast-reports/zap-report.html
            dast-reports/zap-report.json
            dast-reports/zap-report.md
            dast-reports/gate-summary.md
            dast-reports/gate-result.json
            dast-reports/openapi.json
            dast-reports/api-tail.log
          if-no-files-found: warn
          retention-days: 30
