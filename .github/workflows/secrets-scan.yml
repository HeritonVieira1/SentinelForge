name: Secrets scan

# Gitleaks (executado como container fixado por digest, reproduzível localmente com os mesmos comandos).
# Política: qualquer segredo confirmado reprova o job. Sem baseline e sem allowlist global (ver .gitleaks.toml).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1" # varredura semanal de todo o histórico
  workflow_dispatch:

permissions: {}

concurrency:
  group: secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # publicar o SARIF (com valores redigidos) no Code Scanning
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f # v8.30.1
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Prova, a cada execução, que o gate detecta segredos e não acusa placeholders. Os segredos fictícios
      # são gerados em runtime dentro de um container descartável (nunca versionados).
      - name: Gate self-test (fake secrets generated at runtime)
        run: bash security/scripts/secret-scan-selftest.sh

      # Relatórios ficam FORA do workspace para que o scan da árvore não leia o próprio SARIF.
      - name: Prepare report directory
        run: mkdir -p "${RUNNER_TEMP}/gitleaks-reports" && chmod 777 "${RUNNER_TEMP}/gitleaks-reports"

      # Em PR: só os commits da PR. Em push/agenda/manual: todo o histórico.
      - name: Scan commits
        id: commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          opts=()
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            opts=(--log-opts "${PR_BASE_SHA}..${PR_HEAD_SHA}")
            echo "Scanning PR commits ${PR_BASE_SHA}..${PR_HEAD_SHA}"
          else
            echo "Scanning full git history"
          fi
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/repo:ro" -v "${RUNNER_TEMP}/gitleaks-reports:/reports" -w /repo \
            "${GITLEAKS_IMAGE}" git /repo \
            --config /repo/.gitleaks.toml --no-banner --redact --exit-code 1 \
            --report-format sarif --report-path /reports/commits.sarif \
            --log-level warn "${opts[@]}"
          status=$?
          if [ ${status} -ne 0 ]; then
            echo "::error title=Secret detected::Gitleaks reported findings in commits (values are redacted). See the report artifact."
            jq -r '.runs[0].results[]? | "- \(.ruleId) at \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' \
              "${RUNNER_TEMP}/gitleaks-reports/commits.sarif" || true
          fi
          exit ${status}

      - name: Scan working tree
        run: |
          set -uo pipefail
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/repo:ro" -v "${RUNNER_TEMP}/gitleaks-reports:/reports" -w /repo \
            "${GITLEAKS_IMAGE}" dir /repo \
            --config /repo/.gitleaks.toml --no-banner --redact --exit-code 1 \
            --report-format sarif --report-path /reports/tree.sarif \
            --log-level warn
          status=$?
          if [ ${status} -ne 0 ]; then
            echo "::error title=Secret detected::Gitleaks reported findings in the working tree (values are redacted)."
            jq -r '.runs[0].results[]? | "- \(.ruleId) at \(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' \
              "${RUNNER_TEMP}/gitleaks-reports/tree.sarif" || true
          fi
          exit ${status}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-reports
          path: ${{ runner.temp }}/gitleaks-reports/
          if-no-files-found: warn
          retention-days: 30

      # PRs de forks recebem token somente leitura: o upload ao Code Scanning não é possível nesse caso.
      - name: Upload SARIF to Code Scanning (commits)
        if: always() && steps.commits.conclusion != 'skipped' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: ${{ runner.temp }}/gitleaks-reports/commits.sarif
          category: gitleaks-commits
